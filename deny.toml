# cargo-deny config — ARCHITECTURE.md §8.2 / P0.7 CI gate.
# Full policy tightened per-feature; starts permissive-but-audited.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["AGPL-3.0-or-later", "MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
