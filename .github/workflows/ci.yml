# CI — PLAN.md P0.7: fmt/clippy/tests + svelte-check on every PR;
# distro build matrix lands when packaging exists (P8, extended in P10.4).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Tauri shell (netwatch-app) is a workspace member: its system deps
      # must be present for clippy/test of the whole workspace (P0.4).
      - name: install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build daemon binary for process-level tests
        run: cargo build -p netwatchd
      - name: tests
        run: cargo test --workspace

  ui-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # --legacy-peer-deps: npm's strict peer resolver churns endlessly on the
      # typescript peer graph (ERESOLVE with typescript@undefined, hours-long
      # loop, reproducible locally). The lockfile is generated with the same
      # flag, so ci installs exactly what it pinned.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: svelte-check
        run: npm run check
      - name: lint
        run: npm run lint
      - name: unit tests
        run: npm run test
