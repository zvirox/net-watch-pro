# CI — PLAN.md P0.7: fmt/clippy/tests + svelte-check on every PR;
# distro build matrix lands when packaging exists (P8, extended in P10.4).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  ui-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # P0 stopgap: package-lock.json not yet committed (npm resolution churn
      # on the TypeScript peer range). Restore `npm ci` + npm cache as soon as
      # the lockfile lands (tracked in CHECKLIST.md P0.3).
      - run: npm install --no-audit --no-fund
      - name: svelte-check
        run: npm run check
      - name: lint
        run: npm run lint
      - name: unit tests
        run: npm run test
