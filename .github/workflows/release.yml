name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: zvirox/release-workflows/.github/workflows/linux-release.yml@v1
    with:
      app_name: net-watch-pro
      frontend_dir: app
      extra_binaries_cmd: |
        rustup component add rust-src
        curl -fsSL -o /tmp/bpf-linker.tar.zst https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
        tar -xf /tmp/bpf-linker.tar.zst -C "$HOME/.cargo/bin"
        cargo run -p xtask -- bpf
        cargo build --release --locked -p netwatchd
      build_cmd: cargo build --release --locked --manifest-path app/src-tauri/Cargo.toml --target-dir target --features tauri/custom-protocol
      binary_path: target/release/net-watch-pro
      nfpm_config: packaging/nfpm.yaml
    secrets: inherit
