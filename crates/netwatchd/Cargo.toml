[package]
name = "netwatchd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Net Watch Pro daemon: composition root (root systemd service, ARCHITECTURE.md §3)"

[dependencies]
# aya: mandated by PRD §5 / ARCHITECTURE.md §2 (Aya eBPF collector, Phase C).
aya = "0.16.0"
netwatch-api = { path = "../netwatch-api" }
netwatch-common = { path = "../netwatch-common" }
netwatch-core = { path = "../netwatch-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# sqlx: mandated by ARCHITECTURE.md §2 (compile-time-checked SQL, embedded migrations).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "sqlite", "migrate"] }
# thiserror: mandated per-crate by ARCHITECTURE.md §7.1.
thiserror = "2"

[dev-dependencies]
# None yet; integration tests live in netwatch-api (TESTING.md §4 rows for P1).

[lints]
workspace = true
