[package]
name = "netwatch-ebpf"
version = "0.1.0"
edition = "2021"
description = "eBPF programs for Net Watch Pro - per-app byte attribution (ARCHITECTURE.md §4, built separately with nightly + bpf-linker)"

[dependencies]
aya-ebpf = "0.3.0"

[[bin]]
name = "netwatch-ebpf"
path = "src/main.rs"

[workspace]
# Intentionally NOT a member of the root workspace (ARCHITECTURE.md §2,
# F-01/F-11): eBPF needs nightly + -Z build-std=core + bpf-linker.

# BPF targets need opt-level even in dev; panic=abort because no_std cannot unwind.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
rpath = false
