[package]
name = "netwatch-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "API server: WS routes, token auth, request/validation types (API.md contract)"

[dependencies]
netwatch-common = { path = "../netwatch-common" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["sync", "net", "time", "macros"] }
# sqlx: read-side queries for history endpoints (same workspace dep as the
# daemon's writer; approved stack per ARCHITECTURE.md §2).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# chrono + chrono-tz: D4a IANA timezone and billing-cycle boundaries for
# usage aggregates (owner-approved dependency, 2026-11-17).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
thiserror = "2"
subtle = "2.6"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
