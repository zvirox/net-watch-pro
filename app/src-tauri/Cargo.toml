[package]
name = "netwatch-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Net Watch Pro UI shell (Tauri 2) — native daemon link and window lifecycle"

[[bin]]
name = "net-watch-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = ["tray-icon"] }
# Official Tauri 2 native file dialog — export save path (owner-approved 2026-11-18).
tauri-plugin-dialog = "2"
# Official Tauri 2 desktop notifications for budget alerts (owner-approved 2026-11-18).
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
